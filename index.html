    <!-- Landing hero: preload the exact photo the hero <picture> picks and its fonts, on "/" only.
         Prerendered site pages (legal, about, contact, blog): preload their Heebo weights so the
         server-rendered text never re-flows on the font swap (CLS 0.14 desktop / 0.21 mobile on /terms) -->
    <script>
      (function () {
        function font(w) {
          var f = document.createElement('link');
          f.rel = 'preload'; f.as = 'font'; f.type = 'font/woff2'; f.crossOrigin = 'anonymous';
          f.href = '/fonts/heebo/heebo-' + w + '-normal.woff2';
          document.head.appendChild(f);
        }
        if (/^\/(about|contact|privacy|terms|cookies|cancellation|data-processing|data-security|accessibility|blog)(\/|$)/.test(location.pathname)) {
          ['hebrew-400', 'hebrew-500', 'hebrew-700', 'hebrew-800', 'latin-400', 'latin-700'].forEach(font);
          return;
        }
        // Sign-in screens: the headline (800) and the form text (400/500) paint with their final font,
        // fetched in parallel with the app code instead of after it (Lighthouse mobile /login 66).
        if (/^\/(login|register|reset-password|update-password|verify-email)\/?$/.test(location.pathname)) {
          ['hebrew-800', 'hebrew-400', 'hebrew-500', 'latin-400'].forEach(font);
          return;
        }
        if (location.pathname !== '/') return;
        var p = window.matchMedia && matchMedia('(max-aspect-ratio: 2/3)').matches;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/avif'; l.setAttribute('fetchpriority', 'high');
        l.setAttribute('imagesrcset', p
          ? '/landing-hero/pool-p480.avif 480w, /landing-hero/pool-p720.avif 720w, /landing-hero/pool-p1080.avif 1080w'
          : '/landing-hero/pool-960.avif 960w, /landing-hero/pool-1280.avif 1280w, /landing-hero/pool-1920.avif 1920w, /landing-hero/pool-2560.avif 2560w, /landing-hero/pool-3840.avif 3840w');
        l.setAttribute('imagesizes', '100vw');
        document.head.appendChild(l);
        // the hero's Hebrew weights, plus Latin 700 (the digits in the "14" CTA and "₪1,250"), so the
        // bottom-anchored copy never re-flows on a font swap (CLS: a late latin-700 re-wrapped the CTA row)
        ['hebrew-800', 'hebrew-400', 'hebrew-700', 'latin-700'].forEach(font);
      })();
    </script>
