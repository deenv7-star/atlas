# Netlify config for ATLAS SPA
# Ensures /dashboard and all client routes work when visited directly
[build]
  publish = "dist"
  command = "npm run build"

# The SPA shell (app.html) answers only the app's own routes (public/_redirects, generated by
# scripts/spa-routes.mjs); any other URL that is not a file gets 404.html with a 404 status.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers (align with server/middleware/security-headers.js where possible)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
