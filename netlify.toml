# Netlify config for ATLAS SPA
# Ensures /dashboard and all client routes work when visited directly
#
# API (audit finding H5, 2026-11-28): this deployment serves STATIC FILES ONLY —
# there is no Express server here, so /api/* (e.g. /api/billing/*) has nowhere to
# go unless it is proxied to the real API host. Before this fix, /api/* fell through
# to the /* -> /404.html rule below.
# TODO (Deen): replace api-origin-placeholder.invalid in the [[redirects]] block
# below AND in public/_redirects AND in vercel.json with the real Express API
# origin (no trailing slash), e.g. https://api.atlas-il.com — OR set VITE_API_URL
# to that origin at build time: the frontend (src/api/supabaseClient.js) then calls
# the API directly and this proxy is bypassed. Until one of those is done, /api/*
# calls from production builds fail. The placeholder uses the .invalid TLD (RFC 2606),
# which can never resolve — do NOT deploy it as-is.
# NOTE: Netlify does NOT interpolate env vars in netlify.toml (only the `signed` key
# supports an env var name), so the origin cannot come from an env var here; the
# documented workaround is a build-time sed substitution of the placeholder.
# The same /api/* rule is also the first line of public/_redirects, because
# _redirects rules are processed BEFORE netlify.toml rules — without it, the
# /* -> /404.html rule would swallow /api/* first.
[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api/* to the Express API (see TODO above). Must come before the /* catch-all.
[[redirects]]
  from = "/api/*"
  to = "https://api-origin-placeholder.invalid/api/:splat"
  status = 200
  force = true

# The SPA shell (app.html) answers only the app's own routes (public/_redirects, generated by
# scripts/spa-routes.mjs); any other URL that is not a file gets 404.html with a 404 status.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers (align with server/middleware/security-headers.js where possible)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"
