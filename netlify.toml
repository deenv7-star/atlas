# Netlify config for ATLAS SPA
# Ensures /dashboard and all client routes work when visited directly
[build]
  publish = "dist"
  command = "npm run build"

# SPA: serve the app shell for all routes so /dashboard, /login etc. work when visited directly.
# "/" (dist/index.html) and /pricing, /register, /login (dist/<page>/index.html) are prerendered files and
# are served as such (Netlify serves an existing file before a non-forced rewrite); app.html is the plain shell.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Security headers (align with server/middleware/security-headers.js where possible)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
